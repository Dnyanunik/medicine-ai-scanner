<div class="upload-container"
     (drop)="onDrop($event)"
     (dragover)="onDragOver($event)"
     (click)="fileInput.click()">

  <!-- Hidden input file. "capture=environment" hints mobile devices to use the back camera -->
  <input type="file"
         #fileInput
         class="hidden-input"
         accept="image/jpeg, image/png, image/webp"
         capture="environment"
         (change)="onFileSelected($event)">

  <mat-icon class="upload-icon">add_a_photo</mat-icon>

  <h3>Upload or Capture Image</h3>
  <p>Drag and drop a clear photo of the medicine label, or click to browse.</p>

  <button mat-flat-button color="primary">Select Image</button>

  <p class="error-text" *ngIf="errorMessage">{{ errorMessage }}</p>
</div>
